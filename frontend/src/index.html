<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Lilium</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <style>
    /* Écran de démarrage : affiché avant qu'Angular démarre, retiré par App (core/splash.ts).
       Styles en ligne : styles.css n'est pas encore chargé (valeurs de repli = thème de styles.scss). */
    #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 18px;
              background: radial-gradient(600px 400px at 50% 40%, rgba(167, 123, 243, .16), transparent 70%), var(--bg, #08070c);
              font-family: 'Inter', system-ui, sans-serif; transition: opacity .45s, visibility .45s; }
    #splash.done { opacity: 0; visibility: hidden; }
    #splash .seal { position: relative; width: 132px; height: 132px; }
    #splash .ring { position: absolute; inset: 0; animation: splash-spin 14s linear infinite; }
    #splash .ring.inner { inset: 14px; animation-direction: reverse; animation-duration: 9s; }
    #splash .lys { position: absolute; inset: 30px; filter: drop-shadow(0 0 16px rgba(167, 123, 243, .55)); }
    #splash .lys path { stroke: #c8a2ff; stroke-width: .6; stroke-dasharray: 60; stroke-dashoffset: 60; fill-opacity: 0;
                        animation: splash-draw 1.1s cubic-bezier(.2, .7, .2, 1) forwards, splash-fill .6s .8s forwards,
                                   splash-pulse 2.4s 1.4s ease-in-out infinite; }
    #splash .lys path:nth-child(3) { animation-delay: .12s, .9s, 1.4s; }
    #splash .lys path:nth-child(4) { animation-delay: .24s, 1s, 1.4s; }
    #splash .lys path:nth-child(5) { animation-delay: .36s, 1.1s, 1.4s; }
    #splash .name { font-size: 1.6rem; font-weight: 800; letter-spacing: .35em; text-indent: .35em;
                    background: linear-gradient(135deg, #d9bcff 0%, #a77bf3 55%, #7254bd 100%);
                    -webkit-background-clip: text; background-clip: text; color: transparent;
                    opacity: 0; animation: splash-rise .6s .5s cubic-bezier(.2, .7, .2, 1) forwards; }
    #splash .bar { width: 140px; height: 2px; border-radius: 2px; overflow: hidden; background: rgba(200, 162, 255, .12); }
    #splash .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 2px;
                          background: linear-gradient(90deg, transparent, #c8a2ff, transparent);
                          animation: splash-slide 1.2s ease-in-out infinite; }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @keyframes splash-draw { to { stroke-dashoffset: 0; } }
    @keyframes splash-fill { to { fill-opacity: 1; } }
    @keyframes splash-pulse { 50% { opacity: .7; } }
    @keyframes splash-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash *::after { animation: none !important; stroke-dashoffset: 0 !important; fill-opacity: 1 !important; opacity: 1 !important; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Lilium">
    <div class="seal" aria-hidden="true">
      <!-- Anneaux de runes (médiéval) autour du lys Lilium -->
      <svg class="ring" viewBox="0 0 132 132" fill="none" stroke="#7254bd">
        <circle cx="66" cy="66" r="63" stroke-opacity=".5" stroke-dasharray="2 5" />
        <path d="M66 1v8M66 123v8M1 66h8M123 66h8" stroke="#c8a2ff" stroke-width="1.5" />
        <path d="m66 12 4 4-4 4-4-4zM66 112l4 4-4 4-4-4zM12 66l4-4 4 4-4 4zM112 66l4-4 4 4-4 4z" fill="#a77bf3" stroke="none" />
      </svg>
      <svg class="ring inner" viewBox="0 0 104 104" fill="none" stroke="#a77bf3" stroke-opacity=".35">
        <circle cx="52" cy="52" r="50" stroke-dasharray="18 6 2 6" />
      </svg>
      <svg class="lys" viewBox="0 0 32 32">
        <defs>
          <linearGradient id="splash-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e6d3ff" /><stop offset=".55" stop-color="#a77bf3" /><stop offset="1" stop-color="#7254bd" />
          </linearGradient>
        </defs>
        <path fill="url(#splash-grad)" d="M16 2c2.6 3 3.8 6.3 3.6 9.6-.1 2-1.2 3.9-3.6 5.4-2.4-1.5-3.5-3.4-3.6-5.4C12.2 8.3 13.4 5 16 2Z" />
        <path fill="url(#splash-grad)" d="M4 10.5c3.7-.3 6.8.8 8.9 3.2 1.2 1.4 1.8 3.2 1.4 5.6-2.6.4-4.6-.2-6-1.6C6 15.4 4.6 13.2 4 10.5Z" />
        <path fill="url(#splash-grad)" d="M28 10.5c-3.7-.3-6.8.8-8.9 3.2-1.2 1.4-1.8 3.2-1.4 5.6 2.6.4 4.6-.2 6-1.6 2.3-2.3 3.7-4.5 4.3-7.2Z" />
        <path fill="url(#splash-grad)" d="M10 21.5h12l-1.3 2.6h-9.4zM14.4 24.1h3.2l-.6 5.9h-2z" />
      </svg>
    </div>
    <span class="name">LILIUM</span>
    <span class="bar"></span>
  </div>
  <app-root></app-root>
</body>
</html>
