# Tests à chaque push et pull request. Une règle de protection de `main` sur GitHub
# (Settings → Rules) exige que ces jobs passent avant de fusionner.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: lilium-site
      # Le bot à côté du site : tests/test_shared_sync.py vérifie que les copies
      # de app/shared/ et app/assets/ sont identiques à celles du bot (branche main).
      - uses: actions/checkout@v7
        with:
          repository: NicolasDebras/botDiscord
          path: botDiscord
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: lilium-site/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: lilium-site/api
      - run: python -m pytest -q
        working-directory: lilium-site/api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production
